[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "picosort"
version = "0.1.0"
description = "Backend for the SWC ENC 2026 ephys-pop (spike sorting) teaching module"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["picosort"]
