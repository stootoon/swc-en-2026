name: Publish notebook previews

# Renders every module's notebooks to HTML and publishes them to GitHub Pages.
# The notebooks are committed WITH their outputs, so this only renders them --
# it never executes a notebook. That keeps the job fast (~30 s) and means the
# published previews can't drift from what's in the repo.

on:
  push:
    branches: [main]
    paths:
      - "*/notebooks/**"
      - "tools/make_preview.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer
        run: pip install nbconvert nbformat

      - name: Build the preview site
        run: python tools/make_preview.py --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
