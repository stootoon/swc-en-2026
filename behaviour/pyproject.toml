[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swcbehav"
version = "0.1.0"
description = "Backend for the SWC ENC 2026 behaviour teaching module"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[tool.setuptools]
packages = ["swcbehav"]